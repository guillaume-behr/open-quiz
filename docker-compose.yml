services:
    open-quiz-database:
        # Keep in step with the backend job in .github/workflows/ci.yml,
        # which checks that both name the same image.
        image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        # The superuser password only, never the application's secrets: a
        # compromised database must not hand over JWT_SECRET or the student
        # credential key. update.sh creates this file and gives the API its
        # own unprivileged role (scripts/database-roles.sql). Optional so that
        # a deployment updated by an older update.sh keeps running until the
        # next update.sh migrates it: an initialized database needs no password
        # to start.
        env_file:
            - path: ./open-quiz-backend/.env.database
              required: false
        environment:
            POSTGRES_DB: open_quiz
            POSTGRES_USER: open_quiz

        # No published port: the API reaches the database over the internal
        # network. docker-compose.dev.yml publishes it for local development.
        networks:
            open-quiz:
                ipv4_address: ${OPEN_QUIZ_SUBNET_PREFIX:-172.28.0}.4
        volumes:
            - open-quiz-postgres-data:/var/lib/postgresql/data
        init: true
        shm_size: 256mb
        # PostgreSQL writes to its data directory, so read_only is not
        # available here as it is for the other two services. The capability
        # set and no-new-privileges still are: keep them in step.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U open_quiz -d open_quiz"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s
        restart: unless-stopped
        stop_grace_period: 60s
        pids_limit: 128
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

    open-quiz-backend:
        build:
            context: ./open-quiz-backend
            dockerfile: Dockerfile
        env_file:
            - ./open-quiz-backend/.env
        environment:
            APP_ENV: production
            # API worker processes; live updates reach every worker's sockets.
            WEB_CONCURRENCY: ${OPEN_QUIZ_API_WORKERS:-1}
            # DATABASE_URL and DATABASE_PASSWORD come from .env: the API's own
            # role, open_quiz_app, which is not a PostgreSQL superuser.
            # The frontend proxy, whose X-Forwarded-* headers the API trusts.
            FORWARDED_ALLOW_IPS: ${OPEN_QUIZ_SUBNET_PREFIX:-172.28.0}.2,127.0.0.1
        depends_on:
            open-quiz-database:
                condition: service_healthy
        expose:
            - "8000"
        networks:
            open-quiz:
                ipv4_address: ${OPEN_QUIZ_SUBNET_PREFIX:-172.28.0}.3
        init: true
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test:
                [
                    "CMD",
                    "/app/.venv/bin/python",
                    "-c",
                    "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/api/health', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=2)",
                ]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 10s
        restart: unless-stopped
        stop_grace_period: 30s
        pids_limit: 128
        # The API decodes images and hashes passwords on request: bound its
        # memory so that a burst cannot take the database and the host down
        # with it. No swap on top: a thrashing API helps nobody.
        mem_limit: ${OPEN_QUIZ_API_MEMORY:-2g}
        memswap_limit: ${OPEN_QUIZ_API_MEMORY:-2g}
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

    open-quiz-frontend:
        build:
            context: ./open-quiz-frontend
            dockerfile: Dockerfile
            args:
                VITE_API_URL: ${VITE_API_URL:-}
        ports:
            - "127.0.0.1:7800:8080"
        depends_on:
            open-quiz-backend:
                condition: service_healthy
        networks:
            open-quiz-edge: {}
            open-quiz:
                ipv4_address: ${OPEN_QUIZ_SUBNET_PREFIX:-172.28.0}.2
        init: true
        read_only: true
        tmpfs:
            - /config
            - /data
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--quiet",
                    "--tries=1",
                    "--spider",
                    "http://127.0.0.1:8080/healthz",
                ]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 5s
        restart: unless-stopped
        stop_grace_period: 15s
        pids_limit: 64
        mem_limit: ${OPEN_QUIZ_PROXY_MEMORY:-512m}
        memswap_limit: ${OPEN_QUIZ_PROXY_MEMORY:-512m}
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

networks:
    open-quiz-edge:
        name: open-quiz-edge
        driver: bridge
    open-quiz:
        name: open-quiz
        driver: bridge
        internal: true
        ipam:
            config:
                # Change OPEN_QUIZ_SUBNET_PREFIX if 172.28.0.0/24 clashes with a
                # local network: the addresses above and the proxy the API
                # trusts follow it (docs/deployment.md).
                - subnet: ${OPEN_QUIZ_SUBNET_PREFIX:-172.28.0}.0/24

volumes:
    open-quiz-postgres-data:
