services:
    open-quiz-backend:
        build:
            context: ./open-quiz-backend
            dockerfile: Dockerfile
        env_file:
            - ./open-quiz-backend/.env
        environment:
            APP_ENV: production
            DATABASE_URL: sqlite:////data/open-quiz.db
        expose:
            - "8000"
        networks:
            open-quiz:
                ipv4_address: 172.28.0.3
        volumes:
            - open-quiz-data:/data
        init: true
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test:
                [
                    "CMD",
                    "/app/.venv/bin/python",
                    "-c",
                    "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/api/health', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=2)",
                ]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 10s
        restart: unless-stopped
        stop_grace_period: 30s
        pids_limit: 128
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

    open-quiz-frontend:
        build:
            context: ./open-quiz-frontend
            dockerfile: Dockerfile
            args:
                VITE_API_URL: ${VITE_API_URL:-}
        ports:
            - "127.0.0.1:7800:8080"
        depends_on:
            open-quiz-backend:
                condition: service_healthy
        networks:
            open-quiz-edge: {}
            open-quiz:
                ipv4_address: 172.28.0.2
        init: true
        read_only: true
        tmpfs:
            - /config
            - /data
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--quiet",
                    "--tries=1",
                    "--spider",
                    "http://127.0.0.1:8080/healthz",
                ]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 5s
        restart: unless-stopped
        stop_grace_period: 15s
        pids_limit: 64
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

networks:
    open-quiz-edge:
        name: open-quiz-edge
        driver: bridge
    open-quiz:
        name: open-quiz
        driver: bridge
        internal: true
        ipam:
            config:
                - subnet: 172.28.0.0/24

volumes:
    open-quiz-data:
