# Replace quiz.example.com and the certificate paths before enabling this file.

# Open Quiz never keys a limit on an IP address itself, so that it stores none:
# this proxy is the place to bound what one address may send. A whole school
# usually shares one address, hence the generous values: a class signing in
# together fits in the burst. Raise them for a large school, lower them for an
# instance open to the Internet at large.
limit_req_zone $binary_remote_addr zone=open_quiz_sign_in:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=open_quiz_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name quiz.example.com;

    return 301 https://quiz.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quiz.example.com;

    ssl_certificate /etc/letsencrypt/live/quiz.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Question imports and authenticated question updates can reach 96 MiB.
    client_max_body_size 96m;

    # Every student holds one WebSocket and a few requests at a time.
    limit_conn open_quiz_connections 300;
    limit_conn_status 429;
    limit_req_status 429;

    proxy_http_version 1.1;

    # The API only answers to the name in FRONTEND_ORIGIN (or TRUSTED_HOSTS).
    proxy_set_header Host $host;
    # This is the public edge: discard any client-supplied forwarding chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Forward WebSocket negotiation without requiring an http-level map.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # The application sends a WebSocket heartbeat every 25 seconds.
    proxy_read_timeout 75s;

    location / {
        proxy_pass http://127.0.0.1:7800;
    }

    # Sign-in is where each request costs the server a password hash.
    location ~ ^/api/(auth|student-auth)/ {
        limit_req zone=open_quiz_sign_in burst=100 nodelay;
        proxy_pass http://127.0.0.1:7800;
    }
}
