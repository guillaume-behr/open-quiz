[project]
name = "open-quiz-backend"
version = "0.4.0"
description = "FastAPI backend for the Open Quiz classroom quiz platform"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Guillaume BEHR" },
    { name = "Théo WILLEM" },
]
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "certifi>=2026.10.19",
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.139.2",
    "pillow>=13.0.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.2.10",
    "pwdlib>=0.3.0",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    # 2.12.0 clears PYSEC-2026-3846, 3848 and 3849.
    "httpx2>=2.12.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "ARG", "B", "C4", "E4", "E7", "E9", "F", "I", "N", "PERF", "PIE", "PT",
    "RET", "S", "SIM", "UP",
]
ignore = [
    # FastAPI dependency declarations intentionally call parameter helpers.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # Stubs mirror the signature of what they replace, used or not.
    "ARG",
    # pytest asserts; fixtures carry fake credentials; a test runs Alembic
    # in subprocesses.
    "S101", "S105", "S106", "S107", "S603",
]

[tool.ruff.lint.isort]
known-local-folder = ["support"]

[tool.coverage.run]
branch = true
source = ["app", "main", "scripts"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
show_missing = true
skip_covered = true
fail_under = 100
