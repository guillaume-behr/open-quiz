[project]
name = "open-quiz-backend"
version = "0.2.1"
description = "FastAPI backend for the Open Quiz classroom quiz platform"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Guillaume BEHR" },
    { name = "Théo WILLEM" },
]
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.139.2",
    "pillow>=12.1.0",
    "pwdlib>=0.3.0",
    "pyjwt>=2.13.0",
    "pyotp>=2.10.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C4", "E4", "E7", "E9", "F", "I", "PIE", "SIM", "UP"]
ignore = [
    # FastAPI dependency declarations intentionally call parameter helpers.
    "B008",
]
