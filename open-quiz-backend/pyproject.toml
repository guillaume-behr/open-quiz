[project]
name = "open-quiz-backend"
version = "1.0.0"
description = "FastAPI backend for the Open Quiz classroom quiz platform"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Guillaume BEHR" },
    { name = "Théo WILLEM" },
]
dependencies = [
    "alembic>=1.20.1",
    # Not imported: a floor, for security fixes, under the certifi that httpx
    # (FastAPI's standard extra) brings.
    "certifi>=2026.10.19",
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.139.2",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2.10",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    # Never imported here: starlette.testclient loads it instead of httpx,
    # which it deprecates. 2.12.0 clears PYSEC-2026-3846, 3848 and 3849.
    "httpx2>=2.12.0",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"
# Every warning fails the test that raised it, a connection or file left
# open included.
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "ARG", "ASYNC", "B", "C4", "C90", "DTZ", "E4", "E7", "E9", "F", "FAST", "I",
    "N", "PERF", "PIE", "PT", "RET", "RUF", "S", "SIM", "UP",
]
ignore = [
    # FastAPI dependency declarations intentionally call parameter helpers.
    "B008",
    # French text uses typographic apostrophes, non-breaking spaces and
    # guillemets on purpose.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # Stubs mirror the signature of what they replace, used or not.
    "ARG",
    # pytest asserts; fixtures carry fake credentials; a test runs Alembic
    # in subprocesses.
    "S101", "S105", "S106", "S107", "S603",
]

[tool.ruff.lint.isort]
known-local-folder = ["support"]

[tool.mypy]
python_version = "3.14"
files = ["app", "main.py", "scripts", "migrations"]
plugins = ["pydantic.mypy"]
strict = true

[tool.coverage.run]
branch = true
source = ["app", "main", "scripts"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
show_missing = true
skip_covered = true
fail_under = 100
