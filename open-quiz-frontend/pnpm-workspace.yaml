packages: []

overrides:
    # eslint's @eslint/config-array still asks for minimatch 10, which has a
    # published advisory (fixed in 11.0.1).
    minimatch: ">=11.0.3"

allowBuilds:
    esbuild: true

peerDependencyRules:
    allowedVersions:
        # openapi-typescript 7 asks for TypeScript 5, which it only uses to
        # print the types it generates; TypeScript 6 prints them the same.
        openapi-typescript>typescript: "6"
