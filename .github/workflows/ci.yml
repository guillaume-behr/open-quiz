name: CI

on:
  workflow_dispatch:
  pull_request:
  # Weekly, so that a new vulnerability in an image surfaces without a push.
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches:
      - master
      - main

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes; every commit
# on the default branch is still validated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - name: Check the shell scripts
        run: |
          # POSIX sh scripts: parsed by dash (the runner's sh), then linted
          # as sh. shellcheck ships with the runner image.
          scripts="install.sh install-dev.sh update.sh backup.sh restore.sh scripts/*.sh"
          for script in $scripts; do
            sh -n "$script"
          done
          # shellcheck disable=SC2086 # One word per script.
          shellcheck --shell=sh $scripts
      - name: Lint the Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: open-quiz-backend/Dockerfile
      - name: Lint the frontend Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: open-quiz-frontend/Dockerfile
      - name: Lint the workflows
        run: |
          # The download script of the release pinned below, by commit.
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # The image docker-compose.yml deploys; the next step checks it.
        image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_DB: open_quiz_test
          POSTGRES_USER: open_quiz_test
          POSTGRES_PASSWORD: ci-test-postgres-password-2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_quiz_test -d open_quiz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: open-quiz-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Test against the PostgreSQL image production runs
        working-directory: .
        run: |
          deployed=$(sed -n 's/^ *image: *\(postgres:.*\)$/\1/p' docker-compose.yml)
          tested=$(sed -n 's/^ *image: *\(postgres:.*\)$/\1/p' .github/workflows/ci.yml)
          if [ -z "$deployed" ] || [ "$deployed" != "$tested" ]; then
            echo "::error::CI tests $tested but docker-compose.yml deploys $deployed"
            exit 1
          fi
      - run: uv sync --frozen --dev
      - run: uv run --frozen ruff check app tests main.py scripts migrations
      - run: uv run --frozen ruff format --check app tests main.py scripts migrations
      - run: uv run --frozen mypy
      - name: Run backend tests
        env:
          # Disposable values, only used by the ephemeral CI test database.
          APP_ENV: test
          JWT_SECRET: ci-test-jwt-secret-with-enough-variety-2026
          TOTP_ENCRYPTION_KEY: ci-test-totp-key-with-different-variety-2026
          STUDENT_CREDENTIAL_ENCRYPTION_KEY: ci-test-student-credential-key-with-variety-2026
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-test-admin-password-2026
          DATABASE_URL: postgresql+psycopg://open_quiz_test:ci-test-postgres-password-2026@127.0.0.1:5432/open_quiz_test
          TEST_DATABASE_URL: postgresql+psycopg://open_quiz_test:ci-test-postgres-password-2026@127.0.0.1:5432/open_quiz_test
        run: uv run --frozen pytest -q --numprocesses auto --cov --cov-report=term-missing
      - run: uv run --frozen pip-audit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: open-quiz-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.3.0
        with:
          node-version: 24
      # Node 24's Corepack installs the pnpm version package.json pins.
      - run: corepack enable && corepack install
      # Again, now that pnpm exists, to restore and save its store.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: open-quiz-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # The locale and error-code checks, then the unit tests with their
      # coverage thresholds (vite.config.ts).
      - run: pnpm test:coverage
      # Type-checks everything first (tsc -b), as pnpm typecheck would.
      - run: pnpm build
      # What every visitor downloads before the first page renders.
      - run: pnpm check:bundle-size
      - run: pnpm audit --audit-level low

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: open-quiz-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.3.0
        with:
          node-version: 24
      # Node 24's Corepack installs the pnpm version package.json pins.
      - run: corepack enable && corepack install
      # Again, now that pnpm exists, to restore and save its store.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: open-quiz-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The browser build has to match the locked @playwright/test version.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: open-quiz-frontend/test-results/
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
      - name: Validate Compose configuration
        run: |
          cp open-quiz-backend/.env.production.example open-quiz-backend/.env
          docker compose config --quiet
          # The same with the root .env install.sh creates from its example:
          # every Compose setting listed there, at its default.
          cp .env.example .env
          docker compose config --quiet
          while read -r variable; do
            grep -q "$variable" docker-compose.yml scripts/common.sh \
              || { echo "::error::.env.example lists $variable, read neither by docker-compose.yml nor by the scripts"; exit 1; }
          done < <(sed -n 's/^\([A-Z_]*\)=.*/\1/p' .env.example)
          # shellcheck disable=SC2016 # A literal ${ to find in the file.
          while read -r variable; do
            grep -q "^$variable=" .env.example \
              || { echo "::error::docker-compose.yml reads $variable, missing from .env.example"; exit 1; }
          done < <(grep -o '\${[A-Z_]*' docker-compose.yml | sort -u | cut -c3-)
          # install.sh writes these itself below.
          rm open-quiz-backend/.env .env
      - name: Check that both READMEs have the same sections
        run: |
          # Heading levels and their emoji, in order: the titles themselves
          # are translated.
          sections() { grep -o '^##* [^ ]*' "$1" | sed 's/ [A-Za-z0-9].*//'; }
          if ! diff <(sections README.md) <(sections README.en.md); then
            echo "::error::README.md and README.en.md have different sections"
            exit 1
          fi
      - name: Build backend with provenance and SBOM
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: open-quiz-backend
          # An explicit output, attestations included, instead of leaving
          # the result only in the build cache.
          outputs: type=oci,dest=${{ runner.temp }}/open-quiz-backend.tar
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend with provenance and SBOM
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: open-quiz-frontend
          # An explicit output, attestations included, instead of leaving
          # the result only in the build cache.
          outputs: type=oci,dest=${{ runner.temp }}/open-quiz-frontend.tar
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Unpack the images for the scan
        run: |
          # Trivy reads an OCI layout directory, not its tar archive.
          for image in open-quiz-backend open-quiz-frontend; do
            mkdir -p "$RUNNER_TEMP/$image-oci"
            tar -xf "$RUNNER_TEMP/$image.tar" -C "$RUNNER_TEMP/$image-oci"
          done
      - name: Scan the backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/open-quiz-backend-oci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Scan the frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/open-quiz-frontend-oci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          # The first scan already downloaded the database.
          skip-setup-trivy: true
      - name: Remove what the scans left in the checkout
        # The Trivy action writes its cache and the merged ignore file into
        # the working tree, which the deployment check below would flag.
        run: rm -rf .cache trivyignores
      - name: Install with install.sh, as a new deployment would
        run: |
          # The domain the network smoke test sends as its Origin. install.sh
          # generates the secrets, validates them, then runs update.sh.
          sh ./install.sh --domain quiz.example.com >"$RUNNER_TEMP/install.log" 2>&1 \
            || { grep -v 'Administrator password' "$RUNNER_TEMP/install.log"; exit 1; }
          # A second run refuses, and changes nothing.
          before=$(sha256sum .env open-quiz-backend/.env open-quiz-backend/.env.database)
          if sh ./install.sh --domain quiz.example.com >"$RUNNER_TEMP/out" 2>&1; then
            echo "::error::a second install.sh run went on"
            exit 1
          fi
          grep -q 'already exists' "$RUNNER_TEMP/out"
          if [ "$(sha256sum .env open-quiz-backend/.env open-quiz-backend/.env.database)" != "$before" ]; then
            echo "::error::a second install.sh run changed the configuration"
            exit 1
          fi
          # An update of an installed deployment.
          sh ./update.sh --no-pull
      - name: Run container HTTP and WebSocket smoke test
        run: |
          docker compose exec -T open-quiz-backend \
            /app/.venv/bin/python scripts/container_network_smoke.py
          # For the record: image sizes, and the API's peak process and
          # thread count against its pids_limit.
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep open-quiz
          echo "API pids.peak: $(docker compose exec -T open-quiz-backend cat /sys/fs/cgroup/pids.peak)"
          # The runtime image holds no package manager.
          if docker compose exec -T open-quiz-backend sh -c 'command -v uv || command -v uvx'; then
            echo "::error::the backend image ships uv"
            exit 1
          fi
          # update.sh refuses to pull from a working tree with local changes:
          # the files a deployment writes must all be ignored by Git.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::a deployment file is not ignored by Git; update.sh would refuse to update"
            exit 1
          fi
      - name: Check the frontend's caching and routing
        run: |
          base=http://127.0.0.1:7800
          # Print the status line and headers of a response, lower-cased.
          headers() {
            curl -sS -o /dev/null -D - "$base$1" | tr -d '\r' | tr '[:upper:]' '[:lower:]'
          }
          expect() {
            if ! printf '%s\n' "$2" | grep -q "$3"; then
              printf '%s\n' "$2"
              echo "::error::$1: expected $3"
              exit 1
            fi
          }
          page=$(headers /teacher/dashboard)
          expect /teacher/dashboard "$page" '^http/1.1 200'
          expect /teacher/dashboard "$page" '^content-type: text/html'
          expect /teacher/dashboard "$page" '^cache-control: no-cache'
          expect /teacher/dashboard "$page" '^x-robots-tag: noindex'
          asset=$(curl -sS "$base/" | grep -o '/assets/[^"]*\.js' | head -n 1)
          expect "$asset" "$(headers "$asset")" '^cache-control: public, max-age=31536000, immutable'
          pyodide_version=$(sed -n 's/.*"pyodide": "\([^"]*\)".*/\1/p' open-quiz-frontend/package.json)
          wasm=$(headers "/pyodide/$pyodide_version/pyodide.asm.wasm")
          expect pyodide.asm.wasm "$wasm" '^http/1.1 200'
          expect pyodide.asm.wasm "$wasm" '^content-type: application/wasm'
          expect pyodide.asm.wasm "$wasm" '^cache-control: public, max-age=31536000, immutable'
          robots=$(headers /robots.txt)
          expect /robots.txt "$robots" '^http/1.1 200'
          expect /robots.txt "$robots" '^content-type: text/plain'
          expect /does-not-exist.js "$(headers /does-not-exist.js)" '^http/1.1 404'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.3.0
        with:
          node-version: 24
      - name: Run the browser smoke tests against the built images
        working-directory: open-quiz-frontend
        run: |
          corepack enable && corepack install
          pnpm install --frozen-lockfile
          # The browser builds have to match the locked @playwright/test version.
          pnpm exec playwright install --with-deps chromium webkit
          pnpm test:e2e:production
      - name: Keep traces of failed smoke tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-production-results
          path: open-quiz-frontend/test-results/
          retention-days: 7
      - name: Back up and restore the database
        run: |
          sh ./backup.sh --directory "$RUNNER_TEMP/backups"
          backup_file=$(ls "$RUNNER_TEMP"/backups/*.dump)
          # A table the backup does not hold, as a later migration would add:
          # the restore must not leave it behind.
          docker compose exec -T open-quiz-database psql --username=open_quiz \
            --dbname=open_quiz --command="CREATE TABLE created_after_backup (id integer)"
          sh ./restore.sh --yes "$backup_file"
          leftover=$(docker compose exec -T open-quiz-database psql \
            --username=open_quiz --dbname=open_quiz --tuples-only --no-align \
            --command="SELECT count(*) FROM pg_tables WHERE tablename = 'created_after_backup'")
          if [ "$leftover" != 0 ]; then
            echo "::error::restore.sh left a table the backup does not contain"
            exit 1
          fi
          docker compose exec -T open-quiz-backend \
            /app/.venv/bin/python scripts/container_network_smoke.py
      - name: Lock, confirmation, key check and retention of the scripts
        run: |
          # A running operation holds the lock: backup.sh fails at once, so
          # that a scheduled run reports it, then takes over a stale lock.
          sleep 300 &
          holder=$!
          mkdir .open-quiz.lock
          echo "$holder" >.open-quiz.lock/pid
          if sh ./backup.sh --directory "$RUNNER_TEMP/locked" >"$RUNNER_TEMP/out" 2>&1; then
            echo "::error::backup.sh ran while another operation held the lock"
            exit 1
          fi
          grep -q 'another Open Quiz operation is running' "$RUNNER_TEMP/out"
          kill "$holder"
          wait "$holder" || true
          sh ./backup.sh --directory "$RUNNER_TEMP/locked"
          [ ! -e .open-quiz.lock ] || { echo "::error::the lock outlived backup.sh"; exit 1; }
          backup_file=$(ls "$RUNNER_TEMP"/locked/*.dump)
          [ -f "$backup_file.meta" ] || { echo "::error::backup.sh wrote no .meta"; exit 1; }

          # A cancelled restore changes nothing, even on a deployment from
          # before the API's own role, which a restore would migrate.
          cp open-quiz-backend/.env "$RUNNER_TEMP/env.saved"
          sed -i '/^DATABASE_PASSWORD=/d' open-quiz-backend/.env
          before=$(sha256sum open-quiz-backend/.env open-quiz-backend/.env.database)
          if printf 'no\n' | sh ./restore.sh "$backup_file"; then
            echo "::error::restore.sh went on without a confirmation"
            exit 1
          fi
          if [ "$(sha256sum open-quiz-backend/.env open-quiz-backend/.env.database)" != "$before" ]; then
            echo "::error::a cancelled restore changed the environment files"
            exit 1
          fi
          cp "$RUNNER_TEMP/env.saved" open-quiz-backend/.env

          # Other encryption keys than the backup's: refused unless forced.
          sed -i 's/^TOTP_ENCRYPTION_KEY=.*/TOTP_ENCRYPTION_KEY=ci-another-totp-key-0123456789-abcdefghij/' \
            open-quiz-backend/.env
          if sh ./restore.sh --yes "$backup_file" >"$RUNNER_TEMP/out" 2>&1; then
            echo "::error::restore.sh accepted keys that do not match the backup"
            exit 1
          fi
          grep -q 'do not match the backup' "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/env.saved" open-quiz-backend/.env

          # OPEN_QUIZ_BACKUP_KEEP=2: after five backups, two remain.
          printf 'OPEN_QUIZ_BACKUP_KEEP=2\n' >>.env
          for _ in 1 2 3 4 5; do
            sh ./backup.sh --directory "$RUNNER_TEMP/kept"
          done
          sed -i '/^OPEN_QUIZ_BACKUP_KEEP=2$/d' .env
          [ "$(find "$RUNNER_TEMP/kept" -name '*.dump' | wc -l)" = 2 ] \
            || { echo "::error::backup retention did not keep two backups"; exit 1; }
          [ "$(find "$RUNNER_TEMP/kept" -name '*.dump.meta' | wc -l)" = 2 ] \
            || { echo "::error::pruned backups left their .meta behind"; exit 1; }
      - name: Roll back an update whose migration fails
        run: |
          # The deployment above becomes the one to return to.
          sh ./update.sh --no-pull --no-backup
          previous=$(git rev-parse HEAD)
          query() {
            docker compose exec -T open-quiz-database psql --username=open_quiz \
              --dbname=open_quiz --tuples-only --no-align --command="$1"
          }
          previous_head=$(query "SELECT version_num FROM alembic_version")
          # Data written before the update must come back with the rollback.
          query "CREATE TABLE written_before_update (id integer)"
          # An update whose build fails leaves the deployment running...
          printf 'RUN false\n' >>open-quiz-frontend/Dockerfile
          git -c user.name=CI -c user.email=ci@example.invalid \
            commit --quiet --all --message "CI: a build that fails"
          if sh ./update.sh --no-pull --wait-timeout 60; then
            echo "::error::an update whose build fails reported success"
            exit 1
          fi
          # ...and taking writes, which the rollback after a retry must keep.
          query "CREATE TABLE written_after_failed_build (id integer)"
          git -c user.name=CI -c user.email=ci@example.invalid \
            revert --no-edit HEAD >/dev/null
          # A new revision whose migration fails, as one meeting bad data would.
          cat >open-quiz-backend/migrations/versions/9999_ci_failing.py <<EOF
          """Fails on purpose, to test update.sh --rollback in CI."""

          revision = "9999"
          down_revision = "$previous_head"
          branch_labels = None
          depends_on = None


          def upgrade() -> None:
              raise RuntimeError("this migration fails on purpose")


          def downgrade() -> None:
              pass
          EOF
          git add open-quiz-backend/migrations/versions/9999_ci_failing.py
          git -c user.name=CI -c user.email=ci@example.invalid \
            commit --quiet --message "CI: a migration that fails"
          if sh ./update.sh --no-pull --wait-timeout 60; then
            echo "::error::an update whose migration fails reported success"
            exit 1
          fi

          sh ./update.sh --rollback --yes

          if [ "$(git rev-parse HEAD)" != "$previous" ]; then
            echo "::error::the rollback did not check out the previous revision"
            exit 1
          fi
          if [ "$(query "SELECT version_num FROM alembic_version")" != "$previous_head" ]; then
            echo "::error::the rollback did not restore the previous schema"
            exit 1
          fi
          if [ "$(query "SELECT count(*) FROM pg_tables WHERE tablename = 'written_before_update'")" != 1 ]; then
            echo "::error::the rollback lost data written before the update"
            exit 1
          fi
          if [ "$(query "SELECT count(*) FROM pg_tables WHERE tablename = 'written_after_failed_build'")" != 1 ]; then
            echo "::error::the rollback restored a backup older than the retried update"
            exit 1
          fi
          docker compose exec -T open-quiz-backend \
            /app/.venv/bin/python scripts/container_network_smoke.py
      - name: Upgrade PostgreSQL to a new major version
        run: |
          # The procedure of docs/deployment.md, from the previous major to
          # the one docker-compose.yml pins, then back to the old volume.
          previous_image=postgres:16-alpine
          volume=$(docker volume ls --quiet --filter label=com.docker.compose.volume=open-quiz-postgres-data)
          roles() {
            SCRIPT_DIR=$PWD sh -c '. ./scripts/common.sh
              compose() { docker compose "$@"; }
              configure_database_roles open-quiz-backend/.env'
          }
          query() {
            docker compose exec -T open-quiz-database psql --username=open_quiz \
              --dbname=open_quiz --tuples-only --no-align --command="$1"
          }
          # Every table of the schema with its row count.
          counts() {
            query "SELECT string_agg(format('%s=%s', table_name, (xpath('/row/c/text()',
              query_to_xml(format('SELECT count(*) AS c FROM public.%I', table_name), false, true, '')))[1]::text),
              ' ' ORDER BY table_name) FROM information_schema.tables
              WHERE table_schema = 'public' AND table_type = 'BASE TABLE'"
          }
          major() {
            query "SHOW server_version_num" | cut -c1-2
          }
          # An instance installed on the previous major.
          docker compose down
          docker volume rm "$volume"
          sed -i "s|^\( *image: *\)postgres:.*$|\1$previous_image|" docker-compose.yml
          docker compose up --wait --detach open-quiz-database
          roles
          docker compose up --wait --detach
          query "CREATE TABLE written_before_upgrade (id integer); INSERT INTO written_before_upgrade VALUES (1)"
          old_major=$(major)
          before=$(counts)

          # 1. Back up. 2. Stop. 3. Pin the new image.
          sh ./backup.sh --directory "$RUNNER_TEMP/postgres-upgrade"
          backup_file=$(ls "$RUNNER_TEMP"/postgres-upgrade/*.dump)
          docker compose down
          git checkout docker-compose.yml
          # 4. Keep the old data directory in another volume.
          docker volume create "$volume-old"
          docker run --rm --volume "$volume:/from:ro" --volume "$volume-old:/to" \
            "$previous_image" cp -a /from/. /to/
          docker volume rm "$volume"
          # 5. A fresh database, its roles, then the backup.
          docker compose up --wait --detach open-quiz-database
          roles
          sh ./restore.sh --yes "$backup_file"
          # 6. Verify.
          if [ "$(major)" = "$old_major" ]; then
            echo "::error::the database still runs PostgreSQL $old_major"
            exit 1
          fi
          if [ "$(counts)" != "$before" ]; then
            printf 'before: %s\nafter:  %s\n' "$before" "$(counts)"
            echo "::error::the upgraded database does not hold the same rows"
            exit 1
          fi
          docker compose exec -T open-quiz-backend \
            /app/.venv/bin/python scripts/container_network_smoke.py

          # Going back: the old image on the old data directory.
          docker compose down
          docker volume rm "$volume"
          sed -i "s|^\( *image: *\)postgres:.*$|\1$previous_image|" docker-compose.yml
          docker compose create open-quiz-database
          docker run --rm --volume "$volume-old:/from:ro" --volume "$volume:/to" \
            "$previous_image" cp -a /from/. /to/
          docker compose up --wait --detach
          if [ "$(major)" != "$old_major" ] || [ "$(counts)" != "$before" ]; then
            echo "::error::going back to the old volume did not restore the old database"
            exit 1
          fi
          git checkout docker-compose.yml
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop smoke-test containers
        if: always()
        run: docker compose down --volumes

  legacy-upgrade:
    # A deployment from before the API's own PostgreSQL role: one .env with
    # the superuser in DATABASE_URL and POSTGRES_PASSWORD, no .env.database.
    # update.sh must move it to the application role and keep its data.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - name: Start a database in the legacy layout, with data
        run: |
          superuser_password=ci-legacy-postgres-password-2026
          sed \
            -e "s|^DATABASE_URL=.*|DATABASE_URL=postgresql+psycopg://open_quiz@open-quiz-database:5432/open_quiz|" \
            -e "s|^DATABASE_PASSWORD=.*|POSTGRES_PASSWORD=$superuser_password|" \
            -e 's|replace-with-a-long-random-value-of-at-least-32-characters|ci-legacy-jwt-secret-2026-ABCDEFGHIJKLMNOPQRSTUVWXYZ|' \
            -e 's|replace-with-a-different-random-value-of-at-least-32-characters|ci-legacy-totp-secret-2026-abcdefghijklmnopqrstuvwxyz|' \
            -e 's|replace-with-another-random-value-of-at-least-32-characters|ci-legacy-student-secret-2026-0123456789-abcdef|' \
            -e 's|replace-with-a-strong-password-of-at-least-16-characters|ci-legacy-admin-password-2026!|' \
            open-quiz-backend/.env.production.example >open-quiz-backend/.env
          cp .env.example .env
          # The database volume such a deployment has: initialised with the
          # superuser password, holding data. The file is removed again
          # before the update, as a legacy deployment never had it.
          printf 'POSTGRES_PASSWORD=%s\n' "$superuser_password" >open-quiz-backend/.env.database
          docker compose up --wait --detach open-quiz-database
          rm open-quiz-backend/.env.database
          docker compose exec -T open-quiz-database psql --username=open_quiz --dbname=open_quiz \
            --command="CREATE TABLE written_before_upgrade (id integer); INSERT INTO written_before_upgrade VALUES (1)"
      - name: Update with update.sh
        run: sh ./update.sh --no-pull
      - name: Check the migration to the application role
        run: |
          fail() { echo "::error::$1"; exit 1; }
          env_file=open-quiz-backend/.env
          grep -q '^DATABASE_URL=postgresql+psycopg://open_quiz_app@' "$env_file" \
            || fail "DATABASE_URL still names the superuser"
          grep -Eq '^DATABASE_PASSWORD=.{32,}' "$env_file" || fail "no DATABASE_PASSWORD was generated"
          ! grep -q '^POSTGRES_PASSWORD=' "$env_file" || fail "the superuser password stayed in .env"
          grep -q '^POSTGRES_PASSWORD=ci-legacy-postgres-password-2026$' open-quiz-backend/.env.database \
            || fail ".env.database does not hold the superuser password"
          [ "$(stat -c %a "$env_file") $(stat -c %a open-quiz-backend/.env.database)" = "600 600" ] \
            || fail "the environment files are readable by others"
          rows=$(docker compose exec -T open-quiz-database psql --username=open_quiz --dbname=open_quiz \
            --tuples-only --no-align --command="SELECT count(*) FROM written_before_upgrade")
          [ "$rows" = 1 ] || fail "the update lost data"
          docker compose exec -T open-quiz-backend \
            /app/.venv/bin/python scripts/container_network_smoke.py
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
