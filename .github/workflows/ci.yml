name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # The image docker-compose.yml deploys; the next step checks it.
        image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_DB: open_quiz_test
          POSTGRES_USER: open_quiz_test
          POSTGRES_PASSWORD: ci-test-postgres-password-2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_quiz_test -d open_quiz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: open-quiz-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Test against the PostgreSQL image production runs
        working-directory: .
        run: |
          deployed=$(sed -n 's/^ *image: *\(postgres:.*\)$/\1/p' docker-compose.yml)
          tested=$(sed -n 's/^ *image: *\(postgres:.*\)$/\1/p' .github/workflows/ci.yml)
          if [ -z "$deployed" ] || [ "$deployed" != "$tested" ]; then
            echo "::error::CI tests $tested but docker-compose.yml deploys $deployed"
            exit 1
          fi
      - run: uv sync --frozen --dev
      - run: uv run --frozen ruff check app tests main.py scripts migrations
      - run: uv run --frozen ruff format --check app tests main.py scripts migrations
      - run: uv run --frozen mypy
      - name: Run backend tests
        env:
          # Disposable values, only used by the ephemeral CI test database.
          APP_ENV: test
          JWT_SECRET: ci-test-jwt-secret-with-enough-variety-2026
          TOTP_ENCRYPTION_KEY: ci-test-totp-key-with-different-variety-2026
          STUDENT_CREDENTIAL_ENCRYPTION_KEY: ci-test-student-credential-key-with-variety-2026
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-test-admin-password-2026
          DATABASE_URL: postgresql+psycopg://open_quiz_test:ci-test-postgres-password-2026@127.0.0.1:5432/open_quiz_test
          TEST_DATABASE_URL: postgresql+psycopg://open_quiz_test:ci-test-postgres-password-2026@127.0.0.1:5432/open_quiz_test
        run: uv run --frozen pytest -q --cov --cov-report=term-missing
      - run: uv run --frozen pip-audit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: open-quiz-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.3.0
        with:
          node-version: 24
      # Node 24's Corepack installs the pnpm version package.json pins.
      - run: corepack enable && corepack install
      # Again, now that pnpm exists, to restore and save its store.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: open-quiz-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit --audit-level low

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: open-quiz-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.3.0
        with:
          node-version: 24
      # Node 24's Corepack installs the pnpm version package.json pins.
      - run: corepack enable && corepack install
      # Again, now that pnpm exists, to restore and save its store.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: open-quiz-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The browser build has to match the locked @playwright/test version.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: open-quiz-frontend/test-results/
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
      - name: Validate Compose configuration
        run: |
          cp open-quiz-backend/.env.production.example open-quiz-backend/.env
          docker compose config --quiet
      - name: Build backend with provenance and SBOM
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: open-quiz-backend
          # An explicit output, attestations included, instead of leaving
          # the result only in the build cache.
          outputs: type=oci,dest=${{ runner.temp }}/open-quiz-backend.tar
          provenance: mode=max
          sbom: true
      - name: Build frontend with provenance and SBOM
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: open-quiz-frontend
          # An explicit output, attestations included, instead of leaving
          # the result only in the build cache.
          outputs: type=oci,dest=${{ runner.temp }}/open-quiz-frontend.tar
          provenance: mode=max
          sbom: true
      - name: Run container HTTP and WebSocket smoke test
        run: |
          sed -i \
            -e 's|replace-with-a-long-random-value-of-at-least-32-characters|ci-network-jwt-secret-2026-ABCDEFGHIJKLMNOPQRSTUVWXYZ|' \
            -e 's|replace-with-a-different-random-value-of-at-least-32-characters|ci-network-totp-secret-2026-abcdefghijklmnopqrstuvwxyz|' \
            -e 's|replace-with-another-random-value-of-at-least-32-characters|ci-network-student-secret-2026-0123456789-abcdef|' \
            -e 's|replace-with-a-strong-password-of-at-least-16-characters|ci-network-admin-password-2026!|' \
            -e 's|replace-with-a-strong-database-password|ci-network-database-password-2026|' \
            open-quiz-backend/.env
          # The same order as install.sh and update.sh: the database reads
          # its superuser password from its own file, then the API's
          # unprivileged role is created before the API starts.
          printf 'POSTGRES_PASSWORD=%s\n' 'ci-network-postgres-password-2026!' \
            > open-quiz-backend/.env.database
          docker compose up --wait --detach open-quiz-database
          SCRIPT_DIR=$PWD sh -c '. ./scripts/common.sh
            compose() { docker compose "$@"; }
            configure_database_roles open-quiz-backend/.env'
          docker compose up --build --wait --detach
          docker compose exec -T open-quiz-backend \
            /app/.venv/bin/python scripts/container_network_smoke.py
          # update.sh refuses to pull from a working tree with local changes:
          # the files a deployment writes must all be ignored by Git.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::a deployment file is not ignored by Git; update.sh would refuse to update"
            exit 1
          fi
      - name: Back up and restore the database
        run: |
          sh ./backup.sh --directory "$RUNNER_TEMP/backups"
          backup_file=$(ls "$RUNNER_TEMP"/backups/*.dump)
          # A table the backup does not hold, as a later migration would add:
          # the restore must not leave it behind.
          docker compose exec -T open-quiz-database psql --username=open_quiz \
            --dbname=open_quiz --command="CREATE TABLE created_after_backup (id integer)"
          sh ./restore.sh --yes "$backup_file"
          leftover=$(docker compose exec -T open-quiz-database psql \
            --username=open_quiz --dbname=open_quiz --tuples-only --no-align \
            --command="SELECT count(*) FROM pg_tables WHERE tablename = 'created_after_backup'")
          if [ "$leftover" != 0 ]; then
            echo "::error::restore.sh left a table the backup does not contain"
            exit 1
          fi
          docker compose exec -T open-quiz-backend \
            /app/.venv/bin/python scripts/container_network_smoke.py
      - name: Roll back an update whose migration fails
        run: |
          # The deployment above becomes the one to return to.
          sh ./update.sh --no-pull --no-backup
          previous=$(git rev-parse HEAD)
          query() {
            docker compose exec -T open-quiz-database psql --username=open_quiz \
              --dbname=open_quiz --tuples-only --no-align --command="$1"
          }
          previous_head=$(query "SELECT version_num FROM alembic_version")
          # Data written before the update must come back with the rollback.
          query "CREATE TABLE written_before_update (id integer)"
          # A new revision whose migration fails, as one meeting bad data would.
          cat >open-quiz-backend/migrations/versions/9999_ci_failing.py <<EOF
          """Fails on purpose, to test update.sh --rollback in CI."""

          revision = "9999"
          down_revision = "$previous_head"
          branch_labels = None
          depends_on = None


          def upgrade() -> None:
              raise RuntimeError("this migration fails on purpose")


          def downgrade() -> None:
              pass
          EOF
          git add open-quiz-backend/migrations/versions/9999_ci_failing.py
          git -c user.name=CI -c user.email=ci@example.invalid \
            commit --quiet --message "CI: a migration that fails"
          if sh ./update.sh --no-pull --wait-timeout 60; then
            echo "::error::an update whose migration fails reported success"
            exit 1
          fi

          sh ./update.sh --rollback --yes

          if [ "$(git rev-parse HEAD)" != "$previous" ]; then
            echo "::error::the rollback did not check out the previous revision"
            exit 1
          fi
          if [ "$(query "SELECT version_num FROM alembic_version")" != "$previous_head" ]; then
            echo "::error::the rollback did not restore the previous schema"
            exit 1
          fi
          if [ "$(query "SELECT count(*) FROM pg_tables WHERE tablename = 'written_before_update'")" != 1 ]; then
            echo "::error::the rollback lost data written before the update"
            exit 1
          fi
          docker compose exec -T open-quiz-backend \
            /app/.venv/bin/python scripts/container_network_smoke.py
      - name: Stop smoke-test containers
        if: always()
        run: docker compose down --volumes
