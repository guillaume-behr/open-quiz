name: Security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-quiz-backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run --frozen ruff check app tests main.py scripts
      - run: uv run --frozen ruff format --check app tests main.py scripts
      - run: uv run --frozen pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-quiz-frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: open-quiz-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec prettier --check "src/**/*.{ts,tsx}" "public/locales/*/translation.json"
      - run: pnpm build
      - run: pnpm audit --prod --audit-level low

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Validate Compose configuration
        run: |
          cp open-quiz-backend/.env.production.example open-quiz-backend/.env
          docker compose config --quiet
      - name: Build backend with provenance and SBOM
        uses: docker/build-push-action@v7
        with:
          context: open-quiz-backend
          push: false
          provenance: mode=max
          sbom: true
      - name: Build frontend with provenance and SBOM
        uses: docker/build-push-action@v7
        with:
          context: open-quiz-frontend
          push: false
          provenance: mode=max
          sbom: true
