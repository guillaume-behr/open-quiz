# Dependabot proposes dependency updates as pull requests, tested by the
# Security checks workflow like any other change. Minor and patch updates are
# grouped per directory to keep the number of pull requests small; security
# updates still arrive on their own.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /open-quiz-backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /open-quiz-frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /open-quiz-backend
      - /open-quiz-frontend
    schedule:
      interval: weekly
    ignore:
      # Python follows open-quiz-backend/.python-version and Node the
      # node-version CI builds with: move those deliberately, together.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new PostgreSQL major cannot open an older data directory: it
      # needs a dump and restore (docs/deployment.md), never a plain bump.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
    # The backend job tests the same image and fails until its
    # services.postgres.image in .github/workflows/security.yml is updated
    # to match this pull request.
