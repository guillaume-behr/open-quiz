name: Question
description: Demander de l’aide sur l’utilisation, le développement ou le déploiement
title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Ce formulaire crée une issue publique. Ne partagez aucun secret, jeton, fichier `.env` ou donnée d’élève. Une vulnérabilité doit suivre la [procédure privée](https://github.com/guillaume-behr/open-quiz/blob/master/SECURITY.md).
  - type: checkboxes
    id: checks
    attributes:
      label: Vérifications préalables
      options:
        - label: J’ai consulté le README et recherché les issues existantes.
          required: true
        - label: J’ai retiré les secrets, jetons et données personnelles.
          required: true
  - type: dropdown
    id: topic
    attributes:
      label: Sujet
      options:
        - Utilisation
        - Installation locale
        - Déploiement et exploitation
        - Développement et contribution
        - Autre
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Décrivez votre objectif, ce que vous avez essayé et le point qui vous bloque.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version ou commit
      placeholder: Version affichée ou identifiant du commit, si pertinent
  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Navigateur, système, mode local ou Docker et configuration pertinente sans secret.
