name: Proposition d’évolution
description: Proposer une amélioration ou un nouveau besoin
title: "[Évolution] "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Vérifications préalables
      options:
        - label: J’ai recherché les propositions existantes pour éviter un doublon.
          required: true
        - label: Cette demande ne contient aucun secret ni aucune donnée personnelle.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problème à résoudre
      description: Quel besoin utilisateur ou contributeur n’est pas satisfait ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solution proposée
      description: Décrivez le comportement souhaité sans imposer une implémentation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
  - type: textarea
    id: impact
    attributes:
      label: Compatibilité et impact
      description: Signalez les effets possibles sur les données, l’API, l’accessibilité, la sécurité ou les traductions.
  - type: textarea
    id: use_case
    attributes:
      label: Exemple d’utilisation
      description: Décrivez un scénario concret permettant de vérifier que le besoin est satisfait.
